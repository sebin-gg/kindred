version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/kindred"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/kindred/kindred-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
