name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kindred/package-lock.json
      - name: Install & build
        working-directory: kindred
        run: |
          npm install
          npm run build --if-present
          npm run lint --if-present
          npm test --if-present
      - name: Backend install & build
        working-directory: kindred/kindred-backend
        run: |
          npm install
          npm test --if-present