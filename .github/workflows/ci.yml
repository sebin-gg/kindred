name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kindred/package-lock.json
      - name: Install & build
        working-directory: kindred
        run: |
          npm ci
          npm run build --if-present
          npm run lint --if-present || true
          npm test --if-present
      - name: Backend install & build
        working-directory: kindred/kindred-backend
        run: |
          npm ci
          npm test --if-present