name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kindred/package-lock.json
      - name: Install & build
        working-directory: kindred
        run: |
          npm ci --ignore-scripts
          npm run build --if-present
          npm run lint --if-present || true
          npm test --if-present
      - name: Backend install & build
        working-directory: kindred/kindred-backend
        run: |
          npm ci --ignore-scripts
          npm test --if-present