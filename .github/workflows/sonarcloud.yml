name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    if: github.actor != 'dependabot[bot]'
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Node >= 22.8 is required for the built-in `lcov` test reporter.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: kindred/kindred-backend/package-lock.json
      - name: Install backend dependencies
        working-directory: kindred/kindred-backend
        run: npm ci --ignore-scripts
      # Coverage must be generated from the repository root so the lcov `SF:`
      # paths stay relative to the Sonar project base directory. The test files
      # are named by glob because the test runner does not accept a bare
      # directory before Node 26. The spec reporter keeps failures readable in
      # the job log while the lcov reporter writes the report Sonar consumes.
      - name: Generate backend coverage (lcov)
        run: |
          mkdir -p coverage
          node --import ./kindred/kindred-backend/test/test-loader.mjs \
            --test \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/lcov.info \
            'kindred/kindred-backend/test/**/*.test.js'
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
